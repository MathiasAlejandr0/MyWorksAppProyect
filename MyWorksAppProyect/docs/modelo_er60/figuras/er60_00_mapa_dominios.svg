<g id="node8" class="node">
<title>nota</title>
<text text-anchor="start" x="451" y="-131" font-family="Roboto Condensed" font-weight="bold" font-size="10.00">Cómo leer este mapa</text>
<text text-anchor="start" x="451" y="-113.8" font-family="Roboto Condensed" font-size="9.00">60 tablas del esquema public en 7 dominios.</text>
<text text-anchor="start" x="451" y="-97.8" font-family="Roboto Condensed" font-size="9.00">perfiles es el centro: la referencian</text>
<text text-anchor="start" x="451" y="-81.8" font-family="Roboto Condensed" font-size="9.00">tablas de todos los dominios.</text>
<text text-anchor="start" x="451" y="-65.8" font-family="Roboto Condensed" font-size="9.00">perfiles.id = auth.users.id (Supabase Auth).</text>
<text text-anchor="start" x="451" y="-49.8" font-family="Roboto Condensed" font-size="9.00">Las relaciones y claves de cada dominio</text>
<text text-anchor="start" x="451" y="-33.8" font-family="Roboto Condensed" font-size="9.00">están en las figuras A&#45;1 a A&#45;11 (Anexo A).</text>
