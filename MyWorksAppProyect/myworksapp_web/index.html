<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Imagen principal (LCP) servida desde el mismo dominio. La fuente DM Sans
         va en el bundle (@fontsource), sin hoja de Google Fonts que bloquee el render. -->
    <link
      rel="preload"
      as="image"
      href="/hero/tecnico-480.webp"
      media="(max-width: 900px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/hero/tecnico-640.webp"
      media="(min-width: 901px)"
      fetchpriority="high"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>MyWorksApp — Servicios del hogar</title>
    <meta name="description" content="Proyecto de título académico de Ingeniería en Informática, Duoc UC (sede Puerto Montt). Prototipo educativo de MyWorksApp: no es un servicio comercial. Los pagos se realizan con tarjetas de prueba de Transbank (ambiente de integración); no se cobra dinero real." />
    <link rel="canonical" href="https://myworksapp.cl/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MyWorksApp — Servicios del hogar" />
    <meta property="og:description" content="Proyecto de título académico de Ingeniería en Informática, Duoc UC (sede Puerto Montt). Prototipo educativo de MyWorksApp: no es un servicio comercial. Los pagos se realizan con tarjetas de prueba de Transbank (ambiente de integración); no se cobra dinero real." />
    <meta property="og:url" content="https://myworksapp.cl/" />
    <meta property="og:image" content="https://myworksapp-cl.vercel.app/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://myworksapp-cl.vercel.app/og-image.jpg" />
    <meta name="theme-color" content="#00205B" />
  </head>
  <body class="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
