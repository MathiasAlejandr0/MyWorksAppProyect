name: myworksapp
description: App Flutter para conectar usuarios con trabajadores de oficios — perfiles, portafolio y gestión de trabajos con Supabase.
publish_to: 'none'
version: 1.0.15+16

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Textos de Material (calendario, reloj, botones) en español.
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  # Estado y navegación
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  # go_router pide estas libs. 1.1.0 y 1.3.0 están retiradas.
  # Desde Flutter 3.47 (aquí 3.50) entran 1.1.6 y 1.11.0.
  cupertino_ui: ^1.1.6
  material_ui: ^1.11.0

  # Utilidades
  crypto: 3.0.7
  path: ^1.8.3
  intl: ^0.20.2
  uuid: ^4.2.1
  path_provider: ^2.1.1
  shared_preferences: ^2.5.6

  # Mapas y Geolocalización
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  http: ^1.6.0
  url_launcher: ^6.3.3

  # Notificaciones
  flutter_local_notifications: ^22.3.1
  # Push (FCM). Solo se activa si se compila con los --dart-define FCM_*
  # (ver docs/PUSH_NOTIFICACIONES.md); sin ellos la app no toca Firebase.
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  timezone: ^0.11.2

  # Imágenes
  cached_network_image: ^4.0.7
  image_picker: ^1.2.4
  camera: ^0.11.2
  flutter_image_compress: ^2.1.0

  # Calendario
  table_calendar: ^3.3.0

  # Validación
  email_validator: ^2.1.17
  
  # Logging
  logger: ^2.0.2+1
  
  # Permisos
  permission_handler: ^11.3.0
  
  # Compartir/Exportar
  share_plus: ^13.3.1
  
  # Info de app
  package_info_plus: ^10.2.2
  supabase_flutter: ^2.18.3
  app_links: ^6.3.2
  flutter_map: ^8.3.2
  flutter_map_vector_tiles: ^2.11.0
  latlong2: ^0.10.1
  video_player: ^2.14.1
  video_player_win: ^3.3.1
  sentry_flutter: ^9.30.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

# geolocator_android con el listener NMEA desactivado (evita el ANR al pedir el
# GPS en el emulador). Ver third_party/geolocator_android/MYWORKSAPP_PATCH.md.
dependency_overrides:
  geolocator_android:
    path: third_party/geolocator_android

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/services/
    - assets/videos/
