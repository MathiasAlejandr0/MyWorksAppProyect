# Config mínima para CLI (migraciones + functions bajo myworksapp_app/supabase)
project_id = "wxqrfcqifkfgawrnqmnj"

[api]
enabled = true

[functions.webpay-create]
verify_jwt = true

[functions.webpay-commit]
verify_jwt = false

[functions.webpay-handoff]
verify_jwt = false

[functions.webpay-status]
verify_jwt = true

[functions.webpay-refund]
verify_jwt = true

[functions.webpay-refund-cancellation]
verify_jwt = true

[functions.webpay-release]
verify_jwt = true

[functions.webpay-resolve-dispute]
verify_jwt = true

[functions.webpay-refund-rejection]
verify_jwt = true

# Pedido urgencia sin sesión (web): valida datos + crea trabajo + Webpay.
[functions.guest-checkout]
verify_jwt = false

[functions.oneclick-charge]
verify_jwt = true

[functions.oneclick-return]
verify_jwt = false

# La app abre esta URL. El token de Transbank no sale en el JSON del cliente.
[functions.oneclick-handoff]
verify_jwt = false

[functions.invitar-colaborador]
verify_jwt = true

# El invitado aún no tiene sesión. El token firmado reemplaza al correo.
[functions.definir-clave-invitado]
verify_jwt = false

# Funciones viejas desplegadas. Responden 410 para poder pisarlas: el MCP no las borra.
[functions.webpay-create-transaction]
verify_jwt = false

[functions.webpay-commit-transaction]
verify_jwt = false

# Local hasta que se publique en el proyecto (Authentication → Password).
[auth]
minimum_password_length = 8
password_requirements = "letters_digits"
