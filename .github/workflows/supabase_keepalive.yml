name: Supabase Keep-Alive

# Evita que el proyecto Supabase (plan gratuito) se pause por inactividad.
# Hace una peticion ligera cada dia, lo que cuenta como actividad del proyecto.
# Lee la URL y la clave publicable de SupabaseConfig (cliente Flutter).
# Los secrets del repo, si existen, tienen prioridad.
# Nunca uses aquí la service_role.

on:
  schedule:
    # Todos los dias a las 12:00 UTC (08:00 en Chile aprox).
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Supabase credentials
        id: supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          config="myworksapp_app/lib/core/config/supabase_config.dart"
          file_url=$(sed -n "s/.*defaultValue: '\\(https:\\/\\/[^']*supabase\\.co\\)'.*/\\1/p" "$config" | head -n 1)
          file_key=$(sed -n "s/.*defaultValue: '\\(sb_publishable_[^']*\\)'.*/\\1/p" "$config" | head -n 1)
          url="${SUPABASE_URL:-${VITE_URL:-$file_url}}"
          key="${SUPABASE_KEY:-${VITE_KEY:-$file_key}}"
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error ::No hay URL ni clave publicable en SupabaseConfig ni en los secrets."
            exit 1
          fi
          echo "::add-mask::$key"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Ping Supabase REST + Auth
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          SUPABASE_KEY: ${{ steps.supabase.outputs.key }}
        run: |
          set -e

          echo "== Auth health =="
          auth_code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_KEY")
          echo "Auth health HTTP: $auth_code"

          echo "== REST =="
          rest_code="404"
          for table in perfiles profiles; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/${table}?select=id&limit=1" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY")
            echo "REST ${table} HTTP: $code"
            if [ "$code" != "404" ]; then
              rest_code="$code"
              break
            fi
          done

          # Consideramos exito cualquier respuesta del servidor que no sea
          # un fallo de gateway (5xx) o ausencia de conexion (000).
          if [ "$auth_code" = "000" ] || [ "$auth_code" -ge 500 ]; then
            echo "::error ::Auth no respondio correctamente (HTTP $auth_code). El proyecto podria estar pausado o caido."
            exit 1
          fi
          if [ "$rest_code" = "000" ] || [ "$rest_code" -ge 500 ]; then
            echo "::error ::REST no respondio correctamente (HTTP $rest_code). El proyecto podria estar pausado o caido."
            exit 1
          fi

          echo "Keep-alive OK: el proyecto Supabase esta activo."
