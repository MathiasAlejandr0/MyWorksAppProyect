# Menores y parches se agrupan. Los saltos major se ignoran: rompen
# Riverpod, go_router, TypeScript y el cliente de Supabase.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /myworksapp_web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@supabase/supabase-js"
    groups:
      web-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /myworksapp_desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@supabase/supabase-js"
    groups:
      desktop-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /shared
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@supabase/supabase-js"
    groups:
      shared-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pub
    directory: /myworksapp_app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      flutter-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /myworksapp_desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      tauri-minor-patch:
        update-types:
          - minor
          - patch
