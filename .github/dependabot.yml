# Avisos de dependencias vulnerables y desactualizadas.
# Menores y parches se agrupan; los majors quedan en PRs separados
# para no subir de golpe algo incompatible con el stack.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /myworksapp_web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      web-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /myworksapp_desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      desktop-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /shared
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      shared-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pub
    directory: /myworksapp_app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      flutter-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /myworksapp_desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      tauri-minor-patch:
        update-types:
          - minor
          - patch
