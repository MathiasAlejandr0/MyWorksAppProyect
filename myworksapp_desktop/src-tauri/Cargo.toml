[package]
name = "myworksapp-desktop"
version = "0.1.0"
description = "MyWorksApp Desktop Hub"
authors = ["MyWorksApp"]
edition = "2021"

[lib]
name = "myworksapp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
